<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

    <!-- Total Users -->
    <div class="bg-blue-500/10 border border-blue-500/30 backdrop-blur-sm rounded-xl p-6 hover:scale-105 transition-transform duration-300">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-slate-400 text-sm mb-2">Total Users</p>
                <p class="text-4xl font-bold text-blue-500">
                    {{ total_users }}
                </p>
            </div>
            <div class="p-4 rounded-lg bg-blue-500">
                <i class="fas fa-users text-white"></i>
            </div>
        </div>
    </div>

    <!-- Total Patients -->
    <div class="bg-green-500/10 border border-green-500/30 backdrop-blur-sm rounded-xl p-6 hover:scale-105 transition-transform duration-300">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-slate-400 text-sm mb-2">Total Patients</p>
                <p class="text-4xl font-bold text-green-500">
                    {{ total_patients }}
                </p>
            </div>
            <div class="p-4 rounded-lg bg-green-500">
                🏥
            </div>
        </div>
    </div>

    <!-- Total Attacks -->
    <div class="bg-orange-500/10 border border-orange-500/30 backdrop-blur-sm rounded-xl p-6 hover:scale-105 transition-transform duration-300">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-slate-400 text-sm mb-2">Total Attacks</p>
                <p class="text-4xl font-bold text-orange-500">
                    {{ total_attacks }}
                </p>
            </div>
            <div class="p-4 rounded-lg bg-orange-500">
                <i class="fas fa-shield-alt text-white"></i>

            </div>
        </div>
    </div>

    <!-- Blocked IPs -->
    <div class="bg-red-500/10 border border-red-500/30 backdrop-blur-sm rounded-xl p-6 hover:scale-105 transition-transform duration-300">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-slate-400 text-sm mb-2">Blocked IPs</p>
                <p class="text-4xl font-bold text-red-500">
                    {{ blocked_count }}
                </p>
            </div>
            <div class="p-4 rounded-lg bg-red-500">
                <i class="fas fa-ban text-white"></i>
            </div>
        </div>
    </div>
</div>
