<script>
async function loadAlerts() {
    try {
        const response = await fetch("/admin/alerts");
        const data = await response.json();

        const table = document.querySelector("#alertsTable tbody");
        if (!table) {
            return;
        }

        const alerts = Array.isArray(data) ? data : (data.alerts || []);
        table.innerHTML = "";

        alerts.forEach(alert => {
            const row = `
                <tr>
                    <td>${alert.ip}</td>
                    <td>${alert.type}</td>
                    <td>${alert.risk}</td>
                    <td>${alert.time}</td>
                    <td>
                    <a href="/admin/unblock_ip/${encodeURIComponent(alert.ip)}" class="btn btn-warning btn-sm">
                    Unblock
                    </a>
                </td>
                </tr>
            `;
            table.innerHTML += row;
        });

    } catch (error) {
        console.error("Error loading alerts:", error);
    }
}

// 🔁 Refresh every 3 seconds
setInterval(loadAlerts, 3000);

// 🚀 Load immediately on page open
loadAlerts();
</script>
<script>
async function loadLogs() {
    const res = await fetch("/admin/logs");
    const logs = await res.json();

    const table = document.querySelector("#logsTable tbody");
    table.innerHTML = "";

    logs.forEach(log => {
        const row = `
        <tr>
            <td>${log.action}</td>
            <td>${log.user_id}</td>
            <td>${log.time}</td>
        </tr>`;
        table.innerHTML += row;
    });
}

setInterval(loadLogs, 3000);
loadLogs();
</script>
