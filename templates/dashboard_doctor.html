<!DOCTYPE html>
<html>
<head>
    <title>Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
        body {
            background: #0f172a; /* dark navy */
            color: #e2e8f0;
        }

        .card-dark {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        .table-dark-custom {
            background: #1e293b;
            color: #e2e8f0;
        }

        .table-dark-custom th {
            background: #0f172a;
            color: #94a3b8;
        }

        textarea {
            background: #0f172a !important;
            color: white !important;
            border: 1px solid #334155 !important;
        }

        .btn-glow {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
        }

        .btn-danger-glow {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        h2 {
            margin: 0;
        }

        .section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #38bdf8;
        }
    </style>

</head>

<body>

<div class="container mt-4">

    

    <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Doctor Dashboard</h2>
    
    <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">
        Logout
    </a>
</div>
<hr>

    <!-- PATIENTS -->
    <!-- PATIENTS SECTION -->
<div class="card-dark p-4 mt-3">

    <h4 class="section-title">🧾 Patients</h4>

    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle table-dark-custom">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Medical History</th>
                    <th>Doctor Notes</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>

            <tbody>
                {% for p in patients %}
                <tr>

                    <form method="POST" action="/update_patient/{{p.id}}">

                        <td>
                            <strong>{{ p.name }}</strong>
                        </td>

                        <td style="min-width: 250px;">
                            <textarea name="medical_history" class="form-control">{{ p.medical_history }}</textarea>
                        </td>

                        <td style="min-width: 250px;">
                            <textarea name="doctor_notes" class="form-control">{{ p.doctor_notes }}</textarea>
                        </td>

                        <td class="text-center">
                            <button class="btn btn-success btn-sm btn-glow px-3">
                                Update
                            </button>
                        </td>

                    </form>

                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

</body>
</html>
