<!DOCTYPE html>
<html>
<head>
    <title>Reception Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b1220;
            color: #e2e8f0;
            font-family: system-ui, sans-serif;
        }

        /* NAVBAR */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
        }

        /* CARDS */
        .card-dark {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* FORM */
        .form-control {
            background: #111827 !important;
            border: 1px solid #334155 !important;
            color: #fff !important;
        }

        .form-control:focus {
            border-color: #38bdf8 !important;
            box-shadow: none !important;
        }

        /* BUTTONS */
        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            border: none;
        }

        .btn-danger {
            background: #ef4444;
            border: none;
        }

        /* TABLE */
        table {
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #111827 !important;
            color: #38bdf8 !important;
            border: none !important;
        }

        td {
            background: rgba(17, 24, 39, 0.6) !important;
            color: #e5e7eb !important;
            border-color: #1f2937 !important;
        }

        tr:hover td {
            background: rgba(56, 189, 248, 0.08) !important;
        }

        hr {
            border-color: #1f2937;
        }

        h2, h4 {
            color: #38bdf8;
        }

        /* LAYOUT */
        .section {
            margin-bottom: 24px;
        }

        /* FORCE ALL TEXT WHITE */
        body, body * {
            color: #ffffff !important;
        }
        /* Keep accents visible (optional tweak for headers/buttons) */
        h2, h4 {
            color: #38bdf8 !important;
        }
        /* Table header override */
        th {
            color: #ffffff !important;
        }
        /* Inputs text */
        .form-control {
            color: #ffffff !important;
        }
        
        /* Placeholder text */

        .form-control::placeholder {
                color: #cbd5e1 !important;
                    opacity: 1;
                }
                /* Table text fix (Bootstrap override) */
                td {
                        color: #ffffff !important;
                    }
    </style>
</head>

<body>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="topbar">
        <h2>🏥 Reception Dashboard</h2>

        <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">
            Logout
        </a>
    </div>

    <hr>

    <!-- ADD PATIENT -->
    <div class="card-dark section">
        <h4>➕ Add New Patient</h4>

        <form method="POST" action="/add_patient">

            <input type="text" name="name" placeholder="Full Name" class="form-control mb-2" required>
            <input type="number" name="age" placeholder="Age" class="form-control mb-2" required>
            <input type="text" name="gender" placeholder="Gender" class="form-control mb-2">
            <input type="text" name="phone" placeholder="Phone" class="form-control mb-2">
            <textarea name="address" placeholder="Address" class="form-control mb-2"></textarea>
            <textarea name="medical_history" placeholder="Medical History" class="form-control mb-2"></textarea>

            <button class="btn btn-primary w-100 mt-2">
                Add Patient
            </button>

        </form>
    </div>

    <!-- PATIENT LIST -->
    <div class="card-dark section">
        <h4>📋 Patients List</h4>

        <div class="table-responsive mt-3">
            <table class="table table-hover w-100">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                    </tr>
                </thead>

                <tbody>
                    {% for p in patients %}
                    <tr>
                        <td>{{ p.id }}</td>
                        <td>{{ p.name }}</td>
                        <td>{{ p.age }}</td>
                        <td>{{ p.gender }}</td>
                        <td>{{ p.phone }}</td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>

    </div>

</div>

</body>
</html>
